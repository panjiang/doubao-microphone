<!doctype html>
<html lang="zh-CN" class="phone-document"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#161823"><meta name="color-scheme" content="dark"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>豆包远程</title></head>
<body class="phone-page"><main class="phone">
<svg class="phone-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><symbol id="mic" viewBox="0 0 48 64"><rect x="15" y="3" width="18" height="34" rx="9" fill="currentColor"/><path d="M8 29v5a16 16 0 0 0 32 0v-5M24 50v10M14 60h20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol><symbol id="return-key" viewBox="0 0 24 24"><path d="M20 4v9a5 5 0 0 1-5 5H3m5-5-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs></svg>
<header class="phone-header"><span class="brand">豆包远程</span><div class="phone-header-actions"><button id="re-pair" class="phone-qr" aria-label="重新扫码配对" title="重新扫码配对" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8V3h5m8 0h5v5m0 8v5h-5m-8 0H3v-5"/><path d="M7 7h3v3H7zm7 0h3v3h-3zM7 14h3v3H7zm7 0h3v3h-3z"/></svg></button><span id="badge" class="badge">未配对</span></div></header>
<div id="talk" class="phone-surface" role="button" tabindex="0" aria-disabled="true" aria-label="顶栏以下按住说话；圆内松手自动按 Enter，圆外松手仅完成输入。">
<div class="phone-info"><h1 id="computer">连接你的电脑</h1><p id="status" role="status" aria-live="polite">请扫描电脑配置页的配对二维码。</p>
<div id="actions" class="phone-actions" aria-hidden="true"><div><svg aria-hidden="true"><use href="#return-key"/></svg><span>圆内松手，会自动按 Enter 键。</span></div><div><svg aria-hidden="true"><use href="#return-key"/><path d="M2 2l20 20" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>圈外松手，不触发任何按键。</span></div></div>
<section id="pair-section" hidden><button id="pair" class="primary">连接电脑</button><p id="pair-status" role="status"></p></section><p id="mock" class="warning" hidden>开发模拟模式：不会向豆包输入声音或按键。</p></div>
<div id="idle-hint" class="phone-idle is-hidden" aria-hidden="true"><svg><use href="#mic"/></svg><span>按住任意位置说话</span></div>
<canvas id="ripples" aria-hidden="true"></canvas><div id="operation-circle" aria-hidden="true"><svg><use href="#mic"/></svg></div>
</div></main><script type="module" src="/src/phone.ts"></script></body></html>
