<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豆包麦克风</title></head>
<body class="admin-page"><main class="admin dashboard">
<header class="admin-header"><a class="brand" href="/">豆包麦克风</a><div class="header-actions"><span id="badge" class="badge" role="status">正在连接</span><button id="pause" type="button" disabled>暂停接收</button><a class="button-link" href="/settings">设置</a></div></header>
<div id="error" class="admin-alert" role="alert" hidden><span id="error-summary"></span><button id="error-details" type="button">查看详情</button></div><p id="notice" class="admin-notice" role="status"></p>
<p id="mock" class="admin-alert" hidden>模拟模式 · 不产生声音或按键</p>
<div class="dashboard-grid">
<section class="dashboard-card checks-card" aria-labelledby="checks-title"><div class="card-heading"><div><h2 id="checks-title">检查电脑</h2><p id="environment-summary" class="sub" role="status">正在检查运行环境</p></div><button id="environment-refresh" type="button">重新检测</button></div><ul id="environment-checks" class="environment-checks" aria-label="运行环境检查" aria-live="polite"></ul><div id="environment-legacy" hidden><p class="sub">当前平台暂不支持自动检查，请在设置中查看配置。</p><a href="/settings">查看设置</a></div></section>
<section class="dashboard-card pairing-card" aria-labelledby="pair-title"><div class="card-heading"><div><h2 id="pair-title">手机扫码连接</h2><p class="sub">用豆包麦克风 App 扫描二维码</p></div></div>
<div id="qr" class="qr-frame" aria-live="polite"><span>正在准备二维码…</span></div><p id="pair-status" class="pair-status" role="status">正在生成</p><button id="ticket" type="button" class="primary" disabled>正在生成</button><a class="pair-help" href="/settings#web-help">使用手机浏览器？</a>
<div class="device-summary"><div><strong id="device-current">暂无手机连接</strong><p id="device-count" class="sub">正在读取设备</p></div><a href="/settings#devices">管理设备</a></div></section>
</div>
</main><dialog id="detail-dialog" class="admin-dialog" aria-labelledby="detail-title"><div class="dialog-heading"><h2 id="detail-title"></h2><button id="detail-close" type="button" autofocus>关闭</button></div><p id="detail-text"></p></dialog><script type="module" src="/src/admin.ts"></script></body></html>
