apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'local.doubao.voiceremote'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'local.doubao.voiceremote'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '0.1.7'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources.excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1'] }
    buildTypes {
        debug {
            // Hosted CI never receives a signing key. Sign the resulting APK locally.
            if (project.hasProperty('unsignedApk')) { signingConfig = null }
        }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.4'
}

dependencyLocking { lockAllConfigurations() }
