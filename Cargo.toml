[package]
name = "doubao-microphone"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Doubao Microphone"

[features]
windows-umdf-trial = []

[dependencies]
anyhow = "1"
axum = { version = "0.8.8", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
futures-util = "0.3"
hound = "3.5"
if-addrs = "0.13"
include_dir = "0.7"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
rcgen = { version = "0.13.2", features = ["pem", "x509-parser"] }
x509-parser = "=0.16.0"
rubato = "0.16.2"
ringbuf = "0.4.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "=0.18.2"
tray-icon = "0.26.1"
tao = "0.37.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi", "Win32_Media_Audio"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
cc = "=1.11.0"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = true

